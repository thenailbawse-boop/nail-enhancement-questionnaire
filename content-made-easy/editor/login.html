<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Made Easy</title>
<link rel="icon" href="/icon.png">
<meta name="theme-color" content="#0637d6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
  .loginwrap { min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
  .loginbox { width:100%; max-width:420px; background:#fff; border-radius:26px; padding:32px 28px; box-shadow:var(--shadow); text-align:center; }
  .loginbox img { width:56px; height:56px; border-radius:16px; margin-bottom:14px; }
  .loginbox h1 { color:var(--text); font-size:34px; margin:0 0 6px; }
  .loginbox h1 em { background:linear-gradient(90deg, var(--royal), var(--sky)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .loginbox p { color:var(--dim); margin:0 0 22px; }
  .loginbox label { display:block; text-align:left; font-size:13px; font-weight:600; color:var(--dim); margin:12px 0 6px; }
  .loginbox input { width:100%; }
  .loginbox button { width:100%; margin-top:20px; font-size:17px; padding:15px; }
  #err { color:var(--bad); font-weight:600; min-height:20px; margin-top:12px; font-size:14px; }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><i class="orb a"></i><i class="orb b"></i><i class="orb c"></i><i class="grid-lines"></i></div>
<div class="loginwrap">
  <form class="loginbox" id="f">
    <img src="/icon.png" alt="Content Made Easy icon">
    <p class="eyebrow" style="color:var(--blue);margin-bottom:8px">AI Automation Club · Beta</p>
    <h1>Content <em>Made Easy</em></h1>
    <p>Sign in with the beta login from your welcome message.</p>
    <label for="u">Username</label>
    <input type="text" id="u" autocomplete="username" autocapitalize="none" required>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" required style="flex:1;min-width:200px;background:#f7faff;color:var(--text);border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;font:inherit;font-size:15px">
    <button type="submit">Sign in</button>
    <div id="err" role="alert"></div>
  </form>
</div>
<script>
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const r = await fetch("/api/login", { method: "POST", body: JSON.stringify({ user: document.getElementById("u").value, pass: document.getElementById("pw").value }) });
  if (r.ok) location.href = "/";
  else document.getElementById("err").textContent = (await r.json().catch(() => ({}))).error || "That didn't work. Try again.";
};
</script>
</body>
</html>

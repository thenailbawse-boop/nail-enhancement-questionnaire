name: Creator Reset iPhone build

on:
  push:
    paths:
      - "iphone-operator/**"
      - ".github/workflows/creator-reset-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: iphone-operator
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Project structure check
        run: python3 tools/check_xcodeproj.py

      - name: Core logic unit tests (swift test)
        run: cd Core && swift test

      - name: Safari extension tests (node)
        run: cd web-tests && npm ci --no-audit --no-fund || npm install --no-audit --no-fund; npm test

      - name: Build for a real iPhone (unsigned)
        run: |
          status=0
          xcodebuild -project CreatorReset.xcodeproj -scheme CreatorReset -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO build > build-device.log 2>&1 || status=$?
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build-device.log || true
          test "$status" -eq 0
          APPEX=build/device/Build/Products/Release-iphoneos/CreatorReset.app/PlugIns/CreatorResetSafari.appex
          plutil -p "$APPEX/Info.plist" | grep -E "NSExtensionPointIdentifier|CFBundleIdentifier"
          test -f "$APPEX/manifest.json" && test -f "$APPEX/images/icon-128.png"
          test -d build/device/Build/Products/Release-iphoneos/CreatorReset.app/Metadata.appintents

      - name: Build for Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          c = [(r, x) for r, l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]
          c.sort(key=lambda t: t[0])
          print(c[-1][1]["udid"])')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          status=0
          xcodebuild -project CreatorReset.xcodeproj -scheme CreatorReset -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build > build-sim.log 2>&1 || status=$?
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build-sim.log || true
          test "$status" -eq 0

      - name: Simulator UI test (taps Allow, fake photos, run twice, pause switch)
        run: |
          BUNDLE=com.thenailbawse.creatorreset
          mkdir -p ../ci-results
          status=0
          xcodebuild test -project CreatorReset.xcodeproj -scheme CreatorReset -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build/sim -resultBundlePath ../ci-results/UITest.xcresult \
            CODE_SIGNING_ALLOWED=NO > build-uitest.log 2>&1 || status=$?
          grep -E "error:|Tapped Allow|SELFTEST RESULT|Test Case|TEST (SUCCEEDED|FAILED)|\*\* " build-uitest.log || true
          DATA=$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data || true)
          cp "$DATA/Documents/selftest.json" ../ci-results/ 2>/dev/null && cat ../ci-results/selftest.json || echo "no selftest.json"
          cp "$DATA/Library/Application Support/CreatorReset/ledger.json" ../ci-results/ 2>/dev/null || true
          # Open the app normally (no test mode) and photograph the Home screen after the run.
          xcrun simctl launch "$DEVICE" "$BUNDLE" || true
          sleep 6
          xcrun simctl io "$DEVICE" screenshot ../ci-results/simulator-home-after.png || true
          test "$status" -eq 0
          python3 -c 'import json,sys; r=json.load(open("../ci-results/selftest.json")); sys.exit(0 if r["passed"] else 1)'

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-reset-ci-results
          path: |
            ci-results
            iphone-operator/build-*.log
          if-no-files-found: ignore

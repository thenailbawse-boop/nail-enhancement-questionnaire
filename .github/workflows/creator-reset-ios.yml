name: Creator Reset iPhone build

on:
  push:
    paths:
      - "iphone-operator/**"
      - ".github/workflows/creator-reset-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: iphone-operator
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Project structure check
        run: python3 tools/check_xcodeproj.py

      - name: Core logic unit tests (swift test)
        run: cd Core && swift test

      - name: Safari extension tests (node)
        run: cd web-tests && npm ci --no-audit --no-fund || npm install --no-audit --no-fund; npm test

      - name: Build for a real iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project CreatorReset.xcodeproj -scheme CreatorReset -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO build | tee build-device.log | grep -E "error:|warning:|BUILD" || true
          test -d build/device/Build/Products/Release-iphoneos/CreatorReset.app/PlugIns/CreatorResetSafari.appex

      - name: Build for Simulator
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          c = [(r, x) for r, l in d.items() if "iOS" in r for x in l if x["name"].startswith("iPhone")]
          c.sort(key=lambda t: t[0])
          print(c[-1][1]["udid"])')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcodebuild -project CreatorReset.xcodeproj -scheme CreatorReset -configuration Debug \
            -destination "id=$DEVICE" -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build | tee build-sim.log | grep -E "error:|warning:|BUILD" || true
          test -d build/sim/Build/Products/Debug-iphonesimulator/CreatorReset.app

      - name: Simulator self-test (fake photos, run twice, pause switch)
        run: |
          BUNDLE=com.thenailbawse.creatorreset
          xcrun simctl install "$DEVICE" build/sim/Build/Products/Debug-iphonesimulator/CreatorReset.app
          xcrun simctl privacy "$DEVICE" grant photos "$BUNDLE"
          xcrun simctl launch "$DEVICE" "$BUNDLE" -CRSelfTest
          DATA=$(xcrun simctl get_app_container "$DEVICE" "$BUNDLE" data)
          for i in $(seq 1 120); do [ -f "$DATA/Documents/selftest.json" ] && break; sleep 2; done
          mkdir -p ../ci-results
          sleep 3
          xcrun simctl io "$DEVICE" screenshot ../ci-results/simulator-home.png || true
          cp "$DATA/Documents/selftest.json" ../ci-results/ || { echo "Self-test did not finish"; exit 1; }
          cp "$DATA/Library/Application Support/CreatorReset/ledger.json" ../ci-results/ || true
          cat ../ci-results/selftest.json
          python3 -c 'import json,sys; r=json.load(open("../ci-results/selftest.json")); sys.exit(0 if r["passed"] else 1)'

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-reset-ci-results
          path: |
            ci-results
            iphone-operator/build-*.log
          if-no-files-found: ignore
